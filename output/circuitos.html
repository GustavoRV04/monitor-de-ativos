<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Circuitos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0..200"
        rel="stylesheet"

    <link rel="stylesheet" href="/assets/css/design-system.css">

<body>

    <div class="app">

        <div data-include="sidebar.html"></div>

        <main class="content">

            <div data-include="circuitosHeader.html"></div>

            <section class="cards">

                <div class="card card-online" onclick="aplicarFiltroCircuito('OPERACIONAL')">
                    <h3>Operacionais</h3>
                    <div id="totalOperacionais">0</div>
                </div>

                <div class="card card-warning" onclick="aplicarFiltroCircuito('DEGRADADO')">
                    <h3>Degradados</h3>
                    <div id="totalDegradados">0</div>
                </div>

                <div class="card card-offline" onclick="aplicarFiltroCircuito('INDISPONIVEL')">
                    <h3>Indisponíveis</h3>
                    <div id="totalIndisponiveis">0</div>
                </div>

            </section>

            <section id="conteudoCircuitos"></section>

        <script src="/assets/js/components.js"></script>
        <script src="/assets/js/circuitos.js"></script>

        </main>

        <div data-include="rightpanel.html"></div>
