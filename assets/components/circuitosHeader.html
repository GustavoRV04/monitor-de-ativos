<header class="header-inner">
    <div class="header-left">
        <div class="brand">QUALIDADE DE CIRCUITOS</div>
    </div>

    <button class="btn btn-primary btn-criticos" onclick="window.location.href='/circuitos-criticos'">
        ⚠ Circuitos Críticos
    </button>

    <div class="header-center">
        <input id="busca" type="text" placeholder="Pesquisar equipamento ou unidade..." onkeyup="filtrarCircuitos()" />
    </div>

    <div class="header-right">
        <!-- icons kept but hidden by default; enable later if needed -->
        <button class="icon icon-unused" title="Notificações">🔔</button>
        <button class="icon icon-unused" title="Configurações">⚙️</button>
        <button id="themeToggle" class="theme-toggle" onclick="alternarTema()">🌙</button>
    </div>
</header>
